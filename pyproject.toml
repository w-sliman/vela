[project]
name = "vela"
version = "1.2.0"
description = "A venv-native, OpenAI-compatible coding agent with guarded tools, memory, telemetry, browser/GitHub integrations and optional sandboxing."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "openai>=1.100.0",
  "rich>=14.0.0",
  "python-dotenv>=1.1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.50.0"]

github = []

dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
vela = "vela.cli:main"

[tool.ruff]
# Single source of truth for both scripts/check.sh and CI, so the two cannot drift.
# py311 is the floor declared by requires-python; pinning it here is what catches
# 3.12-only syntax (e.g. PEP 701 f-strings) before it reaches an unsupported runtime.
target-version = "py311"

[tool.ruff.lint]
# The source is deliberately dense (semicolon-joined statements, one-line methods).
# Gate on real defects — undefined names, unused bindings, syntax errors — not layout.
select = ["F", "E9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
# Single source of truth for both scripts/check.sh and CI, as with ruff above.
# The source is deliberately dense and largely unannotated, so `disallow_untyped_defs`
# would be noise rather than signal. `check_untyped_defs` is the flag that pays here:
# it type-checks the bodies of unannotated functions, which is where the real defects
# were — a `raise` of a possibly-None variable, an unguarded `Optional` iteration, and
# one name bound to two different types in a single function.
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# Optional extra: only imported inside browser_open, which raises a helpful error
# when it is absent. Installing Playwright just to type-check is not worth it.
module = ["playwright.*"]
ignore_missing_imports = true
